name: Repository Nightly

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

concurrency:
  group: repository-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java-reactor:
    name: Java full reactor verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Verify the full Maven reactor
        run: mvn -B clean verify

  frontend-extended:
    name: Frontend extended targets
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22.23.1
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'

      - name: Activate pnpm 10.34.5 through Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          node --version
          pnpm --version

      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the required frontend matrix
        run: pnpm run ci:frontend

      - name: Build the mobile WeChat target
        run: pnpm --filter @foggy/mobile run build:mp-weixin

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run credential-free widget browser tests
        run: pnpm --filter @foggy/navigator-chat-widget run test:e2e
        env:
          NAVIGATOR_CHAT_WIDGET_LIVE_E2E: '0'

  node-workers-cross-platform:
    name: Node Worker ${{ matrix.worker }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        worker:
          - codex-agent-worker
          - codex-app-server-worker
          - gemini-agent-worker
    defaults:
      run:
        working-directory: tools/${{ matrix.worker }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22.23.1
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: tools/${{ matrix.worker }}/package-lock.json

      - name: Install frozen Worker dependencies
        run: npm ci

      - name: Verify, test, and build Worker
        run: |
          node --version
          npm --version
          npm run --if-present typecheck
          npm run --if-present test
          npm run --if-present build

  python-workers-cross-platform:
    name: Python Worker ${{ matrix.worker }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        worker:
          - claude-agent-worker
          - langgraph-biz-worker
    defaults:
      run:
        working-directory: tools/${{ matrix.worker }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/${{ matrix.worker }}/pyproject.toml

      - name: Install Worker and build tooling
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build
          python -m pip check

      - name: Test Worker without credentialed E2E
        run: python -m pytest -m "not e2e"
        env:
          NO_PROXY: 127.0.0.1,localhost

      - name: Build Worker wheel and sdist
        run: python -m build
