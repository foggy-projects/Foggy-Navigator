name: ${INT001_COMPOSE_PROJECT:?INT001_COMPOSE_PROJECT is required}

# INT-001's disposable services only. The launcher and Biz Worker stay host
# processes so the harness exercises the current checkout without taking over
# the normal local development stack.
services:
  mysql:
    image: mysql:8.4
    restart: "no"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: ${INT001_MYSQL_DATABASE:?INT001_MYSQL_DATABASE is required}
      MYSQL_USER: ${INT001_MYSQL_USER:?INT001_MYSQL_USER is required}
      MYSQL_PASSWORD: ${INT001_MYSQL_PASSWORD:?INT001_MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${INT001_MYSQL_ROOT_PASSWORD:?INT001_MYSQL_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${INT001_MYSQL_PORT:?INT001_MYSQL_PORT is required}:3306"
    labels:
      com.foggy.navigator.int001.managed: "true"
      com.foggy.navigator.int001.run-id: ${INT001_RUN_ID:?INT001_RUN_ID is required}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root --password="$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  mock-llm:
    build:
      context: ../../../mock-llm-service
      dockerfile: Dockerfile
    image: foggy/int001-mock-llm:${INT001_RUN_ID:?INT001_RUN_ID is required}
    restart: "no"
    labels:
      com.foggy.navigator.int001.managed: "true"
      com.foggy.navigator.int001.run-id: ${INT001_RUN_ID:?INT001_RUN_ID is required}
    environment:
      MOCK_LLM_PORT: "8200"
      MOCK_LLM_LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:${INT001_MOCK_LLM_PORT:?INT001_MOCK_LLM_PORT is required}:8200"
    volumes:
      - type: bind
        source: ${INT001_MOCK_RESPONSES_DIR:?INT001_MOCK_RESPONSES_DIR is required}
        target: /app/responses
        read_only: true
    healthcheck:
      # python:3.11-slim does not include curl. Use the interpreter already
      # present in the disposable image so this is not an undeclared runtime
      # tooling dependency.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/admin/health', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

networks:
  default:
    # The host-resident disposable Launcher and fixture workers reach these
    # services only through their explicit 127.0.0.1 port mappings. Docker
    # `internal: true` blocks that host-to-published-port path on this engine,
    # so keep the bridge non-internal; it does not make any service remotely
    # reachable because every published port remains loopback-bound above.
    driver: bridge
    internal: false
    labels:
      com.foggy.navigator.int001.managed: "true"
      com.foggy.navigator.int001.run-id: ${INT001_RUN_ID:?INT001_RUN_ID is required}

volumes:
  mysql-data:
    name: ${INT001_MYSQL_VOLUME:?INT001_MYSQL_VOLUME is required}
    labels:
      com.foggy.navigator.int001.managed: "true"
      com.foggy.navigator.int001.run-id: ${INT001_RUN_ID:?INT001_RUN_ID is required}
