spring:
  main:
    allow-bean-definition-overriding: false

  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400}

system:
  root:
    username: ${SYSTEM_ROOT_USERNAME:root}
    password: ${SYSTEM_ROOT_PASSWORD:}
    email: ${SYSTEM_ROOT_EMAIL:root@foggy.local}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,metrics}
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}

navigator:
  api:
    external-url: ${NAVIGATOR_API_EXTERNAL_URL:}
  security:
    credential-key: ${NAVIGATOR_CREDENTIAL_KEY:}
    credential-salt: ${NAVIGATOR_CREDENTIAL_SALT:}
  database:
    startup-migrations:
      enabled: ${NAVIGATOR_DATABASE_STARTUP_MIGRATIONS_ENABLED:true}
      dry-run: ${NAVIGATOR_DATABASE_STARTUP_MIGRATIONS_DRY_RUN:false}

foggy:
  session:
    message-payload:
      # Stage 5 owns production rollout after shared-store and capacity validation.
      enabled: ${SESSION_MESSAGE_PAYLOAD_ENABLED:false}
      inline-preview-bytes: ${SESSION_MESSAGE_PAYLOAD_INLINE_PREVIEW_BYTES:49152}
      max-payload-bytes: ${SESSION_MESSAGE_PAYLOAD_MAX_BYTES:67108864}
      retention: ${SESSION_MESSAGE_PAYLOAD_RETENTION:PT0S}
      filesystem:
        directory: ${SESSION_MESSAGE_PAYLOAD_STORE_DIRECTORY:}

logging:
  level:
    root: INFO
    com.foggy.navigator: INFO
