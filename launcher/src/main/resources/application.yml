spring:
  application:
    name: foggy-navigator
  main:
    # Development default. Production profile overrides this to false.
    allow-bean-definition-overriding: ${SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING:true}

  # SSE requires long-lived async requests; disable the default 30s timeout
  mvc:
    async:
      request-timeout: -1

  datasource:
    url: jdbc:mysql://localhost:13309/coding_agent?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: foggy
    password: foggy@123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 20000       # 等待连接超时 20s（默认 30s）
      idle-timeout: 600000            # 空闲连接 10 分钟回收
      max-lifetime: 1800000           # 连接最大生命周期 30 分钟
      leak-detection-threshold: 60000 # 连接泄漏检测阈值 60s

  jpa:
    hibernate:
      # Development default. Production profile must use validate/none and pre-provision schema.
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8112
  # SSE requires long-lived async requests; disable the default 30s timeout
  servlet:
    async:
      timeout: -1
  tomcat:
    threads:
      max: 300          # 最大工作线程（默认 200）
      min-spare: 20     # 最小空闲线程，避免突发流量时创建延迟
    max-connections: 10000
    max-http-form-post-size: 30MB
    max-swallow-size: 30MB

# JWT 配置
jwt:
  secret: ${JWT_SECRET:foggy-navigator-jwt-secret-key-change-in-production}
  expiration: ${JWT_EXPIRATION:86400}

# ROOT 账号配置
system:
  root:
    username: ${SYSTEM_ROOT_USERNAME:root}
    password: ${SYSTEM_ROOT_PASSWORD:root123}
    email: ${SYSTEM_ROOT_EMAIL:root@foggy.local}

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,beans,metrics}
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:always}
  metrics:
    tags:
      application: foggy-navigator

# LLM 熔断器配置
agent:
  llm:
    circuit-breaker:
      failure-threshold: ${LLM_CB_FAILURE_THRESHOLD:5}
      cooldown-ms: ${LLM_CB_COOLDOWN_MS:30000}

# 凭证加密配置
navigator:
  security:
    credential-key: ${NAVIGATOR_CREDENTIAL_KEY:default-dev-key-change-in-prod}
    credential-salt: ${NAVIGATOR_CREDENTIAL_SALT:abcdef0123456789}
  codex:
    runtime:
      # Empty by default: compatible Codex CLI patch versions may coexist.
      expected-cli-version: ${NAVIGATOR_CODEX_RUNTIME_EXPECTED_CLI_VERSION:}

# Foggy Navigator 配置
foggy:
  session:
    message-payload:
      # Keep BUG-021's 48 KiB durable metadata envelope until Stage 5 capacity evidence exists.
      enabled: ${SESSION_MESSAGE_PAYLOAD_ENABLED:true}
      inline-preview-bytes: ${SESSION_MESSAGE_PAYLOAD_INLINE_PREVIEW_BYTES:49152}
      max-payload-bytes: ${SESSION_MESSAGE_PAYLOAD_MAX_BYTES:67108864}
      # Expiry and cleanup are Stage 4; do not silently enable an unvalidated retention period.
      retention: ${SESSION_MESSAGE_PAYLOAD_RETENTION:PT0S}
      filesystem:
        directory: ${SESSION_MESSAGE_PAYLOAD_STORE_DIRECTORY:./data/session-message-payloads}
  navigator:
    business:
      agent:
        dev-sync-worker-url: ${BUSINESS_AGENT_DEV_SYNC_WORKER_URL:http://localhost:3061}
        dev-sync-worker-token: ${BUSINESS_AGENT_DEV_SYNC_WORKER_TOKEN:}
        upstreams:
          tms-x3-agent:
            url: ${TMS_X3_AGENT_UPSTREAM_URL:http://localhost:12580}
            user-token-header: ${TMS_X3_AGENT_USER_TOKEN_HEADER:X-TMS-Agent-Token}

# 日志配置
logging:
  level:
    root: INFO
    com.foggy.navigator: DEBUG
    com.github.dockerjava: WARN
  charset:
    file: UTF-8
    console: UTF-8
  file:
    name: logs/backend.log
    path: logs
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] [%X{sessionId}] [%X{agentId}] %-5level %logger{50} - %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] [%X{sessionId}] [%X{agentId}] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB
