spring:
  application:
    name: foggy-navigator
  main:
    # Development default. Production profile overrides this to false.
    allow-bean-definition-overriding: ${SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING:true}

  # SSE requires long-lived async requests; disable the default 30s timeout
  mvc:
    async:
      request-timeout: -1

  datasource:
    url: jdbc:mysql://localhost:13309/coding_agent?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: foggy
    password: foggy@123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 20000       # 等待连接超时 20s（默认 30s）
      idle-timeout: 600000            # 空闲连接 10 分钟回收
      max-lifetime: 1800000           # 连接最大生命周期 30 分钟
      leak-detection-threshold: 60000 # 连接泄漏检测阈值 60s

  jpa:
    hibernate:
      # Development default. Production profile must use validate/none and pre-provision schema.
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        # Runtime request-audit Instants are normalized through JDBC in UTC.
        # LocalDateTime domain fields retain their explicit domain-zone handling.
        jdbc:
          time_zone: UTC

server:
  port: 8112
  # SSE requires long-lived async requests; disable the default 30s timeout
  servlet:
    async:
      timeout: -1
  tomcat:
    threads:
      max: 300          # 最大工作线程（默认 200）
      min-spare: 20     # 最小空闲线程，避免突发流量时创建延迟
    max-connections: 10000
    max-http-form-post-size: 30MB
    max-swallow-size: 30MB

# JWT 配置
jwt:
  secret: ${JWT_SECRET:foggy-navigator-jwt-secret-key-change-in-production}
  expiration: ${JWT_EXPIRATION:86400}

# ROOT 账号配置
system:
  root:
    username: ${SYSTEM_ROOT_USERNAME:root}
    password: ${SYSTEM_ROOT_PASSWORD:root123}
    email: ${SYSTEM_ROOT_EMAIL:root@foggy.local}

# Actuator 配置
management:
  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,beans,metrics,info}
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:always}
  info:
    git:
      # Full mode is safe because the generated git.properties is explicitly allowlisted in launcher/pom.xml.
      mode: full
  metrics:
    tags:
      application: foggy-navigator

# LLM 熔断器配置
agent:
  llm:
    circuit-breaker:
      failure-threshold: ${LLM_CB_FAILURE_THRESHOLD:5}
      cooldown-ms: ${LLM_CB_COOLDOWN_MS:30000}

# 凭证加密配置
navigator:
  cross-project-task:
    # Retired by default. Read-only get/list remain available; this switch is
    # only a rollback path for the legacy mutation surface.
    mutations-enabled: ${NAVIGATOR_CROSS_PROJECT_TASK_MUTATIONS_ENABLED:false}
  background-recovery:
    # Compatibility default: automatic recovery remains available unless a
    # more-specific server-owned deployment profile or provider override wins.
    # Codex SDK/App Server and Claude consume this policy for automatic startup,
    # delayed retry and declared periodic scans; explicit operations remain outside it.
    global:
      enabled: ${NAVIGATOR_BACKGROUND_RECOVERY_ENABLED:true}
      bounds:
        max-attempts: ${NAVIGATOR_BACKGROUND_RECOVERY_MAX_ATTEMPTS:100}
        recovery-window: ${NAVIGATOR_BACKGROUND_RECOVERY_WINDOW:PT24H}
        initial-backoff: ${NAVIGATOR_BACKGROUND_RECOVERY_INITIAL_BACKOFF:PT5S}
        max-backoff: ${NAVIGATOR_BACKGROUND_RECOVERY_MAX_BACKOFF:PT5M}
        max-concurrent-recoveries: ${NAVIGATOR_BACKGROUND_RECOVERY_MAX_CONCURRENCY:4}
        scan-interval: ${NAVIGATOR_BACKGROUND_RECOVERY_SCAN_INTERVAL:PT1M}
    providers: { }
    profiles:
      # Deployment identity aliases local/internal-dev/development to local-dev.
      local-dev:
        enabled: false
  lifecycle:
    # SHADOW projection is opt-in after the additive schema is pre-applied.
    shadow-enabled: ${NAVIGATOR_LIFECYCLE_SHADOW_ENABLED:false}
    activation:
      # Neither switch is authority. Admission additionally requires an exact
      # target manifest, fresh controller observation, active generation,
      # registered instance, DB-time proof and matched Worker identity.
      control-enabled: ${NAVIGATOR_LIFECYCLE_ACTIVATION_CONTROL_ENABLED:false}
      admission-enabled: ${NAVIGATOR_LIFECYCLE_ACTIVATION_ADMISSION_ENABLED:false}
      # Separate opt-in for reusing an already isolated loopback development
      # topology. It never follows from control/admission alone.
      local-development-target-enabled: ${NAVIGATOR_LIFECYCLE_ACTIVATION_LOCAL_DEVELOPMENT_TARGET_ENABLED:false}
      exact-target-id: ${NAVIGATOR_LIFECYCLE_ACTIVATION_EXACT_TARGET_ID:}
      manifest-path: ${NAVIGATOR_LIFECYCLE_ACTIVATION_MANIFEST_PATH:}
      observation-path: ${NAVIGATOR_LIFECYCLE_ACTIVATION_OBSERVATION_PATH:}
      instance-id: ${NAVIGATOR_LIFECYCLE_ACTIVATION_INSTANCE_ID:}
      candidate-head: ${NAVIGATOR_LIFECYCLE_ACTIVATION_CANDIDATE_HEAD:}
      candidate-patch-sha256: ${NAVIGATOR_LIFECYCLE_ACTIVATION_CANDIDATE_PATCH_SHA256:}
      owner-protocol: ${NAVIGATOR_LIFECYCLE_ACTIVATION_OWNER_PROTOCOL:0}
      control-token: ${NAVIGATOR_LIFECYCLE_ACTIVATION_CONTROL_TOKEN:}
      proof-lease: ${NAVIGATOR_LIFECYCLE_ACTIVATION_PROOF_LEASE:PT30S}
      instance-ttl: ${NAVIGATOR_LIFECYCLE_ACTIVATION_INSTANCE_TTL:PT30S}
      observation-max-age: ${NAVIGATOR_LIFECYCLE_ACTIVATION_OBSERVATION_MAX_AGE:PT15S}
      observer-delay: ${NAVIGATOR_LIFECYCLE_ACTIVATION_OBSERVER_DELAY:PT5S}
  runtime-audit:
    termination-receipt-enabled: ${NAVIGATOR_RUNTIME_AUDIT_TERMINATION_RECEIPT_ENABLED:true}
    termination-receipt-retention: ${NAVIGATOR_RUNTIME_AUDIT_TERMINATION_RECEIPT_RETENTION:P7D}
    termination-convergence-timeout: ${NAVIGATOR_RUNTIME_AUDIT_TERMINATION_CONVERGENCE_TIMEOUT:PT5M}
    retention: ${NAVIGATOR_RUNTIME_AUDIT_RETENTION:PT24H}
    # Spring six-field cron; defaults to 02:00 in the Navigator JVM time zone.
    cleanup-cron: "${NAVIGATOR_RUNTIME_AUDIT_CLEANUP_CRON:0 0 2 * * *}"
    cleanup-batch-size: ${NAVIGATOR_RUNTIME_AUDIT_CLEANUP_BATCH_SIZE:200}
    cleanup-max-batches: ${NAVIGATOR_RUNTIME_AUDIT_CLEANUP_MAX_BATCHES:100}
  error-diagnostics:
    retention-days: ${NAVIGATOR_ERROR_DIAGNOSTIC_RETENTION_DAYS:90}
    public-sharing-enabled: ${NAVIGATOR_ERROR_DIAGNOSTIC_PUBLIC_SHARING_ENABLED:true}
    default-share-days: ${NAVIGATOR_ERROR_DIAGNOSTIC_DEFAULT_SHARE_DAYS:7}
    max-share-days: ${NAVIGATOR_ERROR_DIAGNOSTIC_MAX_SHARE_DAYS:30}
    include-safe-stack: ${NAVIGATOR_ERROR_DIAGNOSTIC_INCLUDE_SAFE_STACK:false}
  external:
    # Internal-only by default. Opening the public API surface requires an explicit opt-in.
    enabled: ${NAVIGATOR_EXTERNAL_ENABLED:false}
  worker-gateway:
    # Headerless task-token access is only an internal-dev compatibility mode.
    external-enabled: ${NAVIGATOR_WORKER_GATEWAY_EXTERNAL_ENABLED:false}
  business-agent:
    task-token:
      # Capability tokens are short-lived; the implementation hard-caps TTL at 60 minutes.
      ttl: ${NAVIGATOR_TASK_TOKEN_TTL:PT30M}
      max-ttl: ${NAVIGATOR_TASK_TOKEN_MAX_TTL:PT60M}
  security:
    credential-key: ${NAVIGATOR_CREDENTIAL_KEY:default-dev-key-change-in-prod}
    credential-salt: ${NAVIGATOR_CREDENTIAL_SALT:abcdef0123456789}
  codex:
    runtime:
      # Empty by default: compatible Codex CLI patch versions may coexist.
      expected-cli-version: ${NAVIGATOR_CODEX_RUNTIME_EXPECTED_CLI_VERSION:}

# Foggy Navigator 配置
foggy:
  session:
    message-payload:
      # Keep BUG-021's 48 KiB durable metadata envelope until Stage 5 capacity evidence exists.
      enabled: ${SESSION_MESSAGE_PAYLOAD_ENABLED:true}
      inline-preview-bytes: ${SESSION_MESSAGE_PAYLOAD_INLINE_PREVIEW_BYTES:49152}
      max-payload-bytes: ${SESSION_MESSAGE_PAYLOAD_MAX_BYTES:67108864}
      # Expiry and cleanup are Stage 4; do not silently enable an unvalidated retention period.
      retention: ${SESSION_MESSAGE_PAYLOAD_RETENTION:PT0S}
      filesystem:
        directory: ${SESSION_MESSAGE_PAYLOAD_STORE_DIRECTORY:./data/session-message-payloads}
  navigator:
    business:
      agent:
        dev-sync-worker-url: ${BUSINESS_AGENT_DEV_SYNC_WORKER_URL:http://localhost:3061}
        dev-sync-worker-token: ${BUSINESS_AGENT_DEV_SYNC_WORKER_TOKEN:}
        upstreams:
          tms-x3-agent:
            url: ${TMS_X3_AGENT_UPSTREAM_URL:http://localhost:12580}
            user-token-header: ${TMS_X3_AGENT_USER_TOKEN_HEADER:X-TMS-Agent-Token}

# 日志配置
logging:
  level:
    root: INFO
    com.foggy.navigator: DEBUG
    com.github.dockerjava: WARN
  charset:
    file: UTF-8
    console: UTF-8
  file:
    name: logs/backend.log
    path: logs
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] [%X{sessionId}] [%X{agentId}] %-5level %logger{50} - %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] [%X{sessionId}] [%X{agentId}] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB
